let L = JSON.parse(localStorage.getItem('hd2labels')||'{}');
let i = D.findIndex(r=>!L[r.id]); if(i<0) i=D.length;
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function draw(){
  const n=Object.keys(L).length;
  document.getElementById('pos').textContent=n+' / '+D.length+' labelled';
  document.getElementById('fill').style.width=(100*n/D.length)+'%';
  if(i>=D.length){document.getElementById('rev').textContent='';document.getElementById('done').style.display='block';mk();return}
  document.getElementById('left').textContent='review '+(i+1);
  document.getElementById('rev').innerHTML=esc(D[i].t);
}
function lab(v){ if(i>=D.length)return; L[D[i].id]=v; localStorage.setItem('hd2labels',JSON.stringify(L)); i++; draw() }
function back(){ if(i>0){i--; delete L[D[i].id]; localStorage.setItem('hd2labels',JSON.stringify(L)); draw()} }
function mk(){
  const NL=String.fromCharCode(10), Q=String.fromCharCode(34);
  let out='recommendationid,review,label'+NL;
  for(const r of D){
    const txt=r.t.split(Q).join(Q+Q);
    out += Q+r.id+Q+','+Q+txt+Q+','+Q+(L[r.id]||'')+Q+NL;
  }
  const b=new Blob([out],{type:'text/csv;charset=utf-8'});
  const a=document.getElementById('dl');
  a.href=URL.createObjectURL(b); a.download='validation_sample.csv';
}
document.addEventListener('keydown',e=>{
  if(e.key==='1')lab('positive'); else if(e.key==='2')lab('negative');
  else if(e.key==='3')lab('mixed-neutral'); else if(e.key==='ArrowLeft')back();
});
